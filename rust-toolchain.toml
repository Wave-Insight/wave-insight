#The old lockfile (early 2023) does not build with a current compiler, so the
#project is pinned instead of drifting with `stable`.
#
#Moving to 1.98.1 is part of the Verdi push: sv-parser and wellen need a modern
#compiler, and the front end's git dependencies are gone (see the commit that
#replaced the monaco binding), so the whole workspace can share one toolchain.
#
#To move to a newer rust: run `cargo update` first, fix what breaks, then bump
#the channel below and the three workflows in .github/workflows.
#
#`rustup show` (what CI runs) installs the components and targets declared here,
#so rustfmt/clippy and the wasm target do not need separate install steps.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
