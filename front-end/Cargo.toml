[package]
name = "front-end"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = "0.19"
wave-insight-lib = { path = "../wave-insight-lib" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"

wasm-bindgen = "0.2.80"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-file = "0.2"

num = { version = "0.4.0", features = ["serde"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "File",
    "WebSocket",
    "DataTransfer",
    #measuring the wave canvas
    "Document",
    "Element",
    "DomRect",
    "KeyboardEvent",
    #mouseEvent.detail() for the double click on the splitter
    "UiEvent",]

[dependencies.monaco]
version = "0.3.0"
default-features = false
features = ["yew-components"]
git = "https://github.com/siku2/rust-monaco"
#pin the revision, otherwise a push to that repo silently breaks the build
rev = "4ada87b559672efd0670e36ffb899249b8589cd2"

[features]
default = ["wasm"]
wasm = []
backend = []
server = ["backend"]
tauri = ["backend"]
