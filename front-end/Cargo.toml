[package]
name = "front-end"
version = "0.2.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = "0.19"
wave-insight-lib = { path = "../wave-insight-lib" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"

wasm-bindgen = "0.2.80"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-file = "0.2"

num = { version = "0.4.0", features = ["serde"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "File",
    "WebSocket",
    "DataTransfer",
    #measuring the wave canvas
    "Document",
    "Element",
    "DomRect",
    "KeyboardEvent",
    #mouseEvent.detail() for the double click on the splitter
    "UiEvent",
    #app.rs backend: the websocket message handler (feature = "backend"/"tauri")
    "MessageEvent",
    #code_reader/monaco_glue: inject the AMD loader and mount the editor div
    "Window",
    "Node",
    "EventTarget",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlScriptElement",
    #wave_show: the wave body is drawn on one <canvas> instead of one <svg> per row
    #(web-sys 0.3.106 folds the 2d context mixins into CanvasRenderingContext2d)
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    #console error reporting when the monaco CDN cannot be reached
    "console",]

[features]
default = ["wasm"]
wasm = []
backend = []
server = ["backend"]
tauri = ["backend"]
