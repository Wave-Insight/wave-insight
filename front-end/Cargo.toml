[package]
name = "front-end"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = "0.19"
wave-insight-lib = { path = "../wave-insight-lib" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"

wasm-bindgen = "0.2.80"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "File",
    "DataTransfer",
    #measuring the wave canvas
    "Document",
    "Element",
    "DomRect",
    "KeyboardEvent",
    #mouseEvent.detail() for the double click on the splitter
    "UiEvent",
    #code_reader/monaco_glue: inject the AMD loader and mount the editor div
    "Window",
    "Node",
    "EventTarget",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlScriptElement",
    #wave_show: the wave body is drawn on one <canvas> instead of one <svg> per row
    #(web-sys 0.3.106 folds the 2d context mixins into CanvasRenderingContext2d)
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    #wave_show: repaint the canvas when its box changes without a Yew render
    #(the splitters are tier-A and only write css variables)
    "ResizeObserver",
    #console error reporting when the monaco CDN cannot be reached
    "console",
    #file_load: chunked reads of a big dump, with progress and cancellation
    "FileReader",
    "ProgressEvent",
    "Blob",
    "BlobPropertyBag",
    #wave_show: export signal values as a downloaded csv/txt file
    "Url",
    "HtmlAnchorElement",
    #state/persist: layout and per-signal display settings survive a reload
    "Storage",
    #nav: the modal focus trap walks the focusable elements with querySelectorAll
    "NodeList",]

[features]
default = ["wasm"]
#browser build: files arrive through the file input / drag and drop
wasm = []
#desktop build: tauri provides the file dialog and the launch arguments, the
#dump is still parsed by the wasm build (the backend only returns the bytes)
tauri = []
