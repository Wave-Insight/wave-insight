name: DSH plugin checks

on:
  push:
    paths:
      - 'dsh-plugin/**'
      - 'web-backend/**'
      - 'front-end/**'
      - 'qa/dsh-plugin-smoke.mjs'
      - 'qa/web-backend-smoke.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dsh-plugin.yml'
  pull_request:
    paths:
      - 'dsh-plugin/**'
      - 'web-backend/**'
      - 'front-end/**'
      - 'qa/dsh-plugin-smoke.mjs'
      - 'qa/web-backend-smoke.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dsh-plugin.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin dependencies
        run: npm install --ignore-scripts
        working-directory: dsh-plugin
      - name: Build the loopback web backend
        run: cargo build -p wave-insight-web-backend --release --locked
      - name: Place the backend where the plugin looks for it
        run: cp target/release/wave-insight-web-backend dsh-plugin/bin/wave-insight-web-backend-linux-x64
      - name: Backend protocol smoke test
        run: node qa/web-backend-smoke.mjs
      - name: Host tool smoke test
        run: node qa/dsh-plugin-smoke.mjs

  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check the default browser build
        run: cargo check -p front-end --target wasm32-unknown-unknown --locked
      - name: Check the Web remote build
        run: cargo check -p front-end --target wasm32-unknown-unknown --no-default-features --features web-remote --locked
