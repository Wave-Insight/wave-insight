name: DSH plugin checks

on:
  push:
    paths:
      - 'dsh-plugin/**'
      - 'dsh-bridge/**'
      - 'web-backend/**'
      - 'front-end/**'
      - 'src-tauri/src/dumps.rs'
      - 'qa/dsh-plugin-smoke.mjs'
      - 'qa/dsh-plugin-client.test.mjs'
      - 'qa/dsh-invoke-shim.test.mjs'
      - 'qa/viewer-build-stamp.mjs'
      - 'qa/web-backend-smoke.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dsh-plugin.yml'
  pull_request:
    paths:
      - 'dsh-plugin/**'
      - 'dsh-bridge/**'
      - 'web-backend/**'
      - 'front-end/**'
      - 'src-tauri/src/dumps.rs'
      - 'qa/dsh-plugin-smoke.mjs'
      - 'qa/dsh-plugin-client.test.mjs'
      - 'qa/dsh-invoke-shim.test.mjs'
      - 'qa/viewer-build-stamp.mjs'
      - 'qa/web-backend-smoke.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dsh-plugin.yml'

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Build what the plugin actually spawns, then place it where the bundled
      # path resolution looks, so the tests exercise this source and not a
      # committed binary from an older revision.
      - name: Build the native helper and the loopback backend
        run: cargo build -p dsh-bridge -p wave-insight-web-backend --release --locked

      - name: Place the Linux binaries where the plugin finds them
        run: |
          cp target/release/dsh-bridge dsh-plugin/bin/dsh-bridge-linux-x64
          cp target/release/wave-insight-web-backend dsh-plugin/bin/wave-insight-web-backend-linux-x64
          chmod +x dsh-plugin/bin/dsh-bridge-linux-x64 dsh-plugin/bin/wave-insight-web-backend-linux-x64

      - name: Host tools, projection and helper
        run: node qa/dsh-plugin-smoke.mjs

      - name: Client view diff and registrations
        run: node qa/dsh-plugin-client.test.mjs

      - name: Web-remote shim arguments and origin checks
        run: node qa/dsh-invoke-shim.test.mjs

      - name: Loopback backend, trust rules and static assets
        run: node qa/web-backend-smoke.mjs

      - name: The bundled viewer matches the front-end sources
        run: node qa/viewer-build-stamp.mjs

      - name: The shipped viewer is complete
        run: |
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("dsh-plugin/ui/index.html", "utf8");
            const refs = [...html.matchAll(/(?:src|href)="\/([^"]+)"/g)].map((m) => m[1]);
            if (refs.length < 3) throw new Error("index.html does not reference its bundle");
            for (const ref of refs) {
              const file = `dsh-plugin/ui/${ref}`;
              if (!fs.existsSync(file)) throw new Error(`missing viewer asset: ${file}`);
            }
            console.log(`viewer assets present: ${refs.join(", ")}`);
          '

  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check the default browser build
        run: cargo check -p front-end --target wasm32-unknown-unknown --locked
      - name: Check the Web remote build
        run: cargo check -p front-end --target wasm32-unknown-unknown --no-default-features --features web-remote --locked
