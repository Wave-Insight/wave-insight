name: Audit

# Supply-chain gate: cargo-deny over Cargo.lock with the policy in deny.toml
# (advisories + licenses + bans + sources).
#
# It runs weekly on purpose: a new RustSec advisory must surface even when the
# tree has not changed. deny.toml carries the reasoned ignores for the three
# unmaintained tauri-1.x crates; vulnerabilities are never ignored there.
on:
  schedule:
    # weekly, Monday 04:23 UTC
    - cron: '23 4 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    # The action ships a pinned cargo-deny and refreshes the RustSec advisory
    # database; the checks and the ignore list live in deny.toml, not here.
    # It is a hard gate: a real advisory (like RUSTSEC-2026-0384 on tokio
    # 1.54.0) must turn this red, not be papered over with continue-on-error.
    #
    # `arguments` is the global-flag slot, not a subcommand flag: action.yml
    # (v2.1.1) builds
    #   cargo-deny --log-level warn --manifest-path ./Cargo.toml <arguments> <command>
    # and the action's Dockerfile bundles cargo-deny 0.20.2, whose CLI accepts
    # `cargo-deny --all-features check` and rejects `cargo-deny check --all-features`.
    # So this placement is correct for the action; verified against the action's
    # action.yml/Dockerfile/entrypoint and by running the same command locally.
    - name: cargo deny check
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        arguments: --all-features
        log-level: warn
      continue-on-error: false
