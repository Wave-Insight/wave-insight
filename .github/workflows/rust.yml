name: Rust

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  #the wasm bundle carries the SystemVerilog parser and the waveform backend,
  #optimise the release build for size (28 MB -> 9 MB)
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    #the toolchain version lives in rust-toolchain.toml, do not repeat it here:
    #`rustup show` downloads it and every later cargo call uses it
    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk

    - name: Test the crates that build on the host
      run: cargo test --workspace --exclude front-end --exclude app

    - name: Build
      run: |
          cd front-end
          trunk build --no-default-features --features wasm --release --public-url wave-insight

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./front-end/dist
