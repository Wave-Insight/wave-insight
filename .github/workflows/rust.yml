name: Rust

#Action pinning policy: the workflows use floating major tags (actions/checkout@v4,
#Swatinem/rust-cache@v2, taiki-e/install-action@v2, ...), kept current by
#.github/dependabot.yml (github-actions ecosystem, weekly). SHA pins would defend
#against a re-pointed tag, but every bump becomes an opaque hash change in review
#and dependabot has to rewrite it anyway; the residual risk is accepted for these
#first-party/well-known actions, and the only write token is confined to the
#deploy job at the bottom. Revisit if the project starts signing/releasing more
#artifacts than the tauri tag workflow does.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

#a new push to the same ref supersedes the run that is still building
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  #the wasm bundle carries the SystemVerilog parser and the waveform backend,
  #optimise the release build for size (28 MB -> 9 MB)
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s
  #the release wasm was 9,604,086 bytes when the budget was introduced; leave
  #headroom for a few features and fail loudly on an accidental size blow-up
  WASM_SIZE_BUDGET: 10485760

#the deploy job asks for contents: write below, everything else is read only
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    #the toolchain version lives in rust-toolchain.toml, do not repeat it here:
    #`rustup show` downloads it and every later cargo call uses it
    - name: Install the pinned toolchain
      run: rustup show

    - uses: Swatinem/rust-cache@v2

    - name: Test the crates that build on the host
      run: cargo test --workspace --exclude front-end --exclude app --locked

  #the front end is a wasm crate, but the store/reducer/layout tests are plain
  #host tests; `--exclude front-end` in the job above used to hide all of them
  test-front-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - uses: Swatinem/rust-cache@v2
      with:
        key: front-end-tests

    - name: Test the front end (reducer, store, layout, geometry)
      run: cargo test -p front-end --bins --locked

  #the release profile is what ships (lto, codegen-units=1, panic=abort), and a
  #panic=abort-only or lto-only breakage would not show up in the dev-profile job
  #above. Measured warm: 3m01s to build the lib+back-end tests, and a cold run is
  #worse, so it is a separate job with its own cache key instead of doubling the
  #critical path of every PR.
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - uses: Swatinem/rust-cache@v2
      with:
        key: release

    - name: Test the crates that build on the host (release profile)
      run: cargo test --workspace --exclude front-end --exclude app --release --locked

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    #declared in rust-toolchain.toml as well; the explicit add keeps this job
    #independent of how much `rustup show` installs on a given rustup version
    - name: Add rustfmt
      run: rustup component add rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

  #the tauri crate links webkit2gtk-4.0, which only exists on ubuntu-22.04
  #(see the same apt line in tauri.yml), so the whole workspace is linted there
  clippy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - name: Install dependencies (ubuntu only)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add clippy
      run: rustup component add clippy

    - uses: Swatinem/rust-cache@v2
      with:
        key: clippy

    - name: Clippy (warnings are errors)
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        #pinned: trunk's wasm-bindgen/wasm-opt defaults move between releases
        tool: trunk@0.22.1

    - uses: Swatinem/rust-cache@v2
      with:
        key: wasm

    - name: Build
      run: |
          cd front-end
          #leading and trailing slash: a relative public url (no leading /) is
          #resolved against /wave-insight/ and every asset 404s
          trunk build --no-default-features --features wasm --release --public-url /wave-insight/

    #the desktop shell compiles the front end with --features tauri; a change that
    #breaks that cfg only fails in a release-tag run otherwise
    - name: Check the desktop feature of the front end
      run: cargo check -p front-end --no-default-features --features tauri --target wasm32-unknown-unknown --locked

    - name: Check the wasm size budget
      run: |
          set -eux
          wasm=$(ls front-end/dist/*_bg.wasm)
          size=$(stat -c%s "$wasm")
          echo "$wasm is $size bytes, budget $WASM_SIZE_BUDGET"
          test "$size" -le "$WASM_SIZE_BUDGET"

    #the qa job below runs the browser matrix against this bundle
    - name: Upload the web bundle
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: front-end/dist
        retention-days: 3

  #the only job with a write token: it publishes the artifact the build job
  #uploaded to gh-pages. Split out on purpose, so the compile steps and every
  #third-party action they run see the read-only workflow token, and so the
  #publish only happens after a successful build (needs: build).
  deploy:
    needs: build
    #a dispatch from a feature branch must not overwrite the public demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download the built web bundle
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: front-end/dist

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./front-end/dist

  #Smoke-test the built bundle in headless Chrome (qa/README.md).
  #ADVISORY ON PURPOSE: the assertions are DOM/canvas driven and read pixels, so
  #a runner-image change (fonts, GPU/SwiftShader) can flake them. Keep the job out
  #of the required path until it has a green track record, then delete
  #continue-on-error and add it to the required checks.
  qa:
    #the job name says it: advisory. A red run is visible in the run list and its
    #screenshots are uploaded below, but it does not block a merge yet.
    name: qa (advisory)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Download the built web bundle
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: front-end/dist

    #ubuntu-latest ships google-chrome; qa/run.mjs finds it on PATH or via CHROME
    - name: Browser smoke test (empty, vcd, layout, layoutRules)
      run: node qa/run.mjs --scenarios empty,vcd,layout,layoutRules

    #advisory job: the screenshots are the way to see why a run went red
    #(qa/artifacts is gitignored, so they only exist as a workflow artifact)
    - name: Upload the QA screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-artifacts
        path: qa/artifacts
        if-no-files-found: ignore
        retention-days: 7