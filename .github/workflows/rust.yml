name: Rust

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  #the wasm bundle carries the SystemVerilog parser and the waveform backend,
  #optimise the release build for size (28 MB -> 9 MB)
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install rust 1.67.1 (see rust-toolchain.toml)
      uses: actions-rs/toolchain@v1
      with:
          toolchain: 1.67.1
          target: wasm32-unknown-unknown
          override: true
          
    - uses: actions/checkout@v3
    - name: install trunk
      run: |
          cargo install --locked trunk
          cargo install wasm-bindgen-cli
      
    - uses: actions/checkout@v3
    - name: Build
      run: |
          cd front-end
          trunk build --no-default-features --features wasm --release --public-url wave-insight
          
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./front-end/dist