name: Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk

    #tauri-action builds the bundles and uploads them to the release itself, so
    #the old upload-release-asset@v1 steps are gone: that action was removed by
    #github and the `@dev` ref of tauri-action no longer resolves to something
    #stable
    - name: Build and release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download and install this version.'
        releaseDraft: false
        prerelease: false
