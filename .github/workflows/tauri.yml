name: Tauri

on:
  push:
    tags:
      - 'v*'
  #manual desktop builds (artifacts only, never a release) live in tauri_pre.yml

env:
  CARGO_TERM_COLOR: always
  #the wasm bundle embedded in the desktop app has to use the same size profile
  #as the web build (rust.yml), otherwise the app ships the ~28 MB variant
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
    #tauri 2 links webkit2gtk-4.1 (tauri 1.x needed 4.0, which is why this job
    #used to be pinned to ubuntu-22.04); 4.1 is what ubuntu 24.04 ships, so the
    #runner is back on the current LTS. libxdo-dev is in the v2 prerequisite list.
    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        #pinned: trunk's wasm-bindgen/wasm-opt defaults move between releases
        tool: trunk@0.22.1

    - uses: Swatinem/rust-cache@v2
      with:
        key: tauri

    #one build per platform: tauri-action runs `beforeBuildCommand` from
    #tauri.conf.json (trunk build --features tauri) and then cargo builds the
    #app and the bundles. The explicit trunk+cargo build that used to run here
    #built all of that a second time; the plain binary is staged from the same
    #target dir below instead.
    - name: Build and release
      if: startsWith(github.ref, 'refs/tags/')
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download and install this version.'
        releaseDraft: false
        prerelease: false

    #an installer is not always what people want, so the plain binary is
    #published as well, under the names the old releases used. macos-latest is
    #arm64, hence the _mac_arm64 suffix.
    - name: Stage the plain binary
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -eux
        case "${{ matrix.platform }}" in
          windows-*) bin=target/release/app.exe ;;
          *)         bin=target/release/app ;;
        esac
        test -f "$bin"
        case "${{ matrix.platform }}" in
          windows-*) out="wave_insight_tauri.exe" ;;
          ubuntu-*)  out="wave_insight_tauri_ubuntu" ;;
          *)         out="wave_insight_tauri_mac_arm64" ;;
        esac
        cp "$bin" "$out"
        ls -l "$out"

    - name: Upload the plain binary
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: wave_insight_tauri*
        fail_on_unmatched_files: true

  # The DSH plugin ships one helper and one loopback backend per platform and
  # none of them are committed, so this job cannot open with a checkout that
  # already has them: the reusable workflow builds all four pairs and the
  # packaging job unpacks the artifacts into the bundle.
  dsh-plugin-binaries:
    uses: ./.github/workflows/dsh-plugin-binaries.yml

  dsh-plugin:
    # Do not depend on `build`: a desktop-build flake must not skip the plugin
    # tarball. softprops/action-gh-release attaches to the existing tag (and
    # creates the release if the desktop job did not).
    needs: [dsh-plugin-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Merged download: every artifact holds its pair already named the way the
      # package declares it, so they land side by side in one directory.
      - name: Collect the four platform pairs
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-plugin-*
          path: staging
          merge-multiple: true

      - name: Stage them into the bundle and check the manifest
        run: |
          node dsh-plugin/scripts/binaries.mjs stage --from staging
          node dsh-plugin/scripts/binaries.mjs verify
          chmod +x dsh-plugin/bin/dsh-bridge-linux-x64 dsh-plugin/bin/wave-insight-web-backend-linux-x64 \
            dsh-plugin/bin/dsh-bridge-macos-arm64 dsh-plugin/bin/wave-insight-web-backend-macos-arm64 \
            dsh-plugin/bin/dsh-bridge-macos-x64 dsh-plugin/bin/wave-insight-web-backend-macos-x64
          ls -l dsh-plugin/bin

      - name: Run the bundle tests against the release binaries
        run: |
          node qa/dsh-plugin-smoke.mjs
          node qa/dsh-plugin-client.test.mjs
          node qa/dsh-invoke-shim.test.mjs
          node qa/web-backend-smoke.mjs
          node qa/viewer-build-stamp.mjs

      - name: Pack the DSH bundle
        run: npm pack --pack-destination .
        working-directory: dsh-plugin

      # The manifest check above reads the working tree; this one reads the
      # tarball npm actually produced, so a `files` typo cannot ship a bundle
      # with a platform silently missing.
      - name: The tarball carries every platform
        run: node dsh-plugin/scripts/binaries.mjs verify --tarball "$(ls dsh-plugin/*.tgz)"

      - name: Attach the plugin to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dsh-plugin/*.tgz
          fail_on_unmatched_files: true
