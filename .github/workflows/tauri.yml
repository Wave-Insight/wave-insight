name: Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk

    #an installer is not always what people want, so a plain binary is published
    #as well, under the names the old releases used. Build it ourselves instead
    #of hunting for whatever tauri-action left behind: on linux and macos its
    #output did not end up anywhere `find` looked.
    - name: Build the plain binary
      shell: bash
      run: |
        set -eux
        cd front-end
        trunk build --no-default-features --features tauri --release
        cd ..
        cargo build --release -p app
        ls -l target/release | head -n 30

    - name: Stage the plain binary
      shell: bash
      run: |
        set -eux
        case "${{ matrix.platform }}" in
          windows-*) bin=target/release/app.exe ;;
          *)         bin=target/release/app ;;
        esac
        test -f "$bin"
        case "${{ matrix.platform }}" in
          windows-*) out="wave_insight_tauri.exe" ;;
          ubuntu-*)  out="wave_insight_tauri_ubuntu" ;;
          *)         out="wave_insight_tauri_mac_arm64" ;;
        esac
        cp "$bin" "$out"
        ls -l "$out"

    #tauri-action builds the bundles and uploads them to the release itself, so
    #the old upload-release-asset@v1 steps are gone: that action was removed by
    #github and the `@dev` ref of tauri-action no longer resolves to something
    #stable
    - name: Build and release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download and install this version.'
        releaseDraft: false
        prerelease: false

    - name: Upload the plain binary
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: wave_insight_tauri*
        fail_on_unmatched_files: true
