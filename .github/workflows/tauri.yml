name: Tauri

on:
  push:
    tags:
      - 'v*'
  #manual desktop builds (artifacts only, never a release) live in tauri_pre.yml

env:
  CARGO_TERM_COLOR: always
  #the wasm bundle embedded in the desktop app has to use the same size profile
  #as the web build (rust.yml), otherwise the app ships the ~28 MB variant
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
    #ubuntu-22.04 is pinned on purpose: tauri 1.x links webkit2gtk-4.0, which
    #ubuntu 24.04 no longer ships (it has 4.1). Do not move to ubuntu-latest
    #before the tauri 2 migration.
    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        #pinned: trunk's wasm-bindgen/wasm-opt defaults move between releases
        tool: trunk@0.22.1

    - uses: Swatinem/rust-cache@v2
      with:
        key: tauri

    #one build per platform: tauri-action runs `beforeBuildCommand` from
    #tauri.conf.json (trunk build --features tauri) and then cargo builds the
    #app and the bundles. The explicit trunk+cargo build that used to run here
    #built all of that a second time; the plain binary is staged from the same
    #target dir below instead.
    - name: Build and release
      if: startsWith(github.ref, 'refs/tags/')
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download and install this version.'
        releaseDraft: false
        prerelease: false

    #an installer is not always what people want, so the plain binary is
    #published as well, under the names the old releases used. macos-latest is
    #arm64, hence the _mac_arm64 suffix.
    - name: Stage the plain binary
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -eux
        case "${{ matrix.platform }}" in
          windows-*) bin=target/release/app.exe ;;
          *)         bin=target/release/app ;;
        esac
        test -f "$bin"
        case "${{ matrix.platform }}" in
          windows-*) out="wave_insight_tauri.exe" ;;
          ubuntu-*)  out="wave_insight_tauri_ubuntu" ;;
          *)         out="wave_insight_tauri_mac_arm64" ;;
        esac
        cp "$bin" "$out"
        ls -l "$out"

    - name: Upload the plain binary
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: wave_insight_tauri*
        fail_on_unmatched_files: true
