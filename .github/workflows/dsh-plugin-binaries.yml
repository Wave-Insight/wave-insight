name: DSH plugin binaries

# Builds the native pieces the DSH plugin ships: one `dsh-bridge` helper and one
# loopback viewer backend for every row of the matrix in
# `dsh-plugin/host/assets.js`. None of them are committed — `dsh-plugin/bin/` is
# ignored by git — so this workflow is the only source of the binaries that go
# into the tarball. The release workflow calls it and unpacks the artifacts;
# dispatching it by hand leaves the artifacts to download.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `key` is the `platform/arch` row in `dsh-plugin/host/assets.js`
          # (Node's `process.platform` spelling: win32, linux, darwin).
          #
          # musl, not gnu: a glibc-linked binary runs only on the distribution
          # (and libc generation) it was built against — the reason this row used
          # to pin ubuntu-22.04 to hold the requirement down to glibc 2.35. A
          # static musl build carries its libc, so one file serves Alpine and
          # every glibc distribution instead of tracking which Ubuntu, Debian or
          # RHEL release is old enough.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            key: linux/x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: win32/x64
          - os: macos-latest
            target: aarch64-apple-darwin
            key: darwin/arm64
          # macos-latest is arm64; clang cross-links the Intel slice from the
          # same SDK, so the Intel Mac pair comes off the same runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            key: darwin/x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; `rustup show` installs it before
      # `target add` runs, so the target lands in the toolchain cargo will use.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the build target
        run: rustup target add ${{ matrix.target }}

      - name: Build the helper and the loopback backend
        run: cargo build -p dsh-bridge -p wave-insight-web-backend --release --locked --target ${{ matrix.target }}

      # The release names come from the matrix, so the packaging job can unpack
      # every artifact with one merged download and no renaming.
      - name: Stage them under their release names
        shell: bash
        run: node dsh-plugin/scripts/binaries.mjs stage --set ${{ matrix.key }} --from target/${{ matrix.target }}/release

      - name: Upload the platform pair
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-${{ matrix.target }}
          path: dsh-plugin/bin/*
          if-no-files-found: error
