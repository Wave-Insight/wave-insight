name: Tauri

#publishing happens on a `v*` tag in tauri.yml, this one is for building the
#desktop app on demand. It used to run on every push to main on three runners,
#which is a lot of CI time for a job nobody reads.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: actions/checkout@v4

    - name: Install the pinned toolchain
      run: rustup show

    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Install trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk

    - name: Build the app
      run: |
        cd front-end
        trunk build --no-default-features --features tauri --release
        cd ..
        cargo build --release -p app

    - name: Upload the binary
      uses: actions/upload-artifact@v4
      with:
        name: wave-insight-tauri-${{ matrix.platform }}
        path: |
          target/release/app
          target/release/app.exe
        if-no-files-found: warn
