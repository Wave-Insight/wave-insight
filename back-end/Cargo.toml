[package]
name = "back-end"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
# The websocket/http demo that used to live here (and serialised the legacy
# `Module`/`ModuleValue` model over :2993) is gone: the browser reads files
# itself, so it had no job left. What remains is the stdio transport of the
# language server; the protocol core itself lives in `wave-insight-lib::lsp` so
# the desktop, the wasm build and the editor share it.

[dependencies]
wave-insight-lib = { path = "../wave-insight-lib" }

#stdio transport of the `lsp` binary
lsp-server = "0.7"

serde_json = "1.0"
