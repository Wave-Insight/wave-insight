[package]
name = "app"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
# Tauri 2: validates tauri.conf.json (v2 schema), generates the ACL schemas and
# the capabilities, and embeds the frontend. Keep it on the same major as tauri.
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

wave-insight-lib = { path = "../wave-insight-lib" }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devUrl` is an URL
default = [ "custom-protocol" ]
# this feature is used for production builds where `frontendDist` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
