[package]
name = "wave-insight-lib"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
#enables the `#[bench]` benchmarks, needs a nightly toolchain:
#  cargo +nightly bench -p wave-insight-lib --features nightly-bench
nightly-bench = []

[dependencies]
num="0.4.0"
linked-hash-map = { version = "0.5.4", features = ["serde_impl"] }
serde = { version = "1.0", features = ["derive"] }

#waveform reading: vcd, fst and ghw through one api
wellen = "0.25"

#systemverilog front end (preprocessor + parser + syntax tree with spans)
sv-parser = "0.13"

[dev-dependencies]
#round trip tests for the types that cross the wasm boundary
serde_json = "1"

#statistics driven benchmarks of the waveform hot paths (benches/waveform.rs);
#`html_reports` writes the report under target/criterion and is what the bench
#workflow uploads. Dev only: the wasm bundles never see it.
criterion = { version = "0.5", features = ["html_reports"] }

#a plain binary driven by criterion's own harness, not by libtest
[[bench]]
name = "waveform"
harness = false
