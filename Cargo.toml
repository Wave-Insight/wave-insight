[workspace]

members = [
    "wave-insight-lib",
    "front-end",
    "back-end",
    "src-tauri",
]

#crates here are edition 2021, keep feature unification the way it is meant to be
resolver = "2"

#profiles are only read from the workspace root, per-crate `[profile.release]`
#is silently ignored by cargo
[profile.release]
lto = true
codegen-units = 1
#the wasm bundle is the main distribution channel, dropping the landing pads
#and the unwinder removes a large chunk of it
panic = "abort"
